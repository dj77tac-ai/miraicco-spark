<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f3ee">
<title>Spark｜みらいっこ</title>
<link rel="stylesheet" href="vendor/page-flip.css">
<link rel="stylesheet" href="style.css?v=9c8318aa">
</head>
<body>

<!-- ① パスワードの画面 -->
<section id="lock" class="screen">
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <div class="lock-card">
    <p class="eyebrow">みらいっこ 季刊誌</p>
    <h1 class="logo">Spark</h1>
    <p class="tagline">遊びは最高の学びだ。</p>

    <p class="lock-lead">
      これまでの Spark を、スマートフォンやパソコンで<br>
      ページをめくるように読んでいただけます。
    </p>

    <form id="lock-form" autocomplete="off">
      <label for="pw">パスワード</label>
      <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="パスワードを入れてください">
      <button id="lock-btn" type="submit">ひらく</button>
      <p id="lock-msg" class="msg" role="status" aria-live="polite"></p>
    </form>

    <p class="lock-note">
      パスワードはみらいっこからお知らせしたものです。<br>
      わからないときは職員におたずねください。
    </p>
  </div>

  <p class="lock-foot">© 株式会社ストーリーボード</p>
</section>

<!-- ② 一覧（本だな） -->
<section id="shelf" class="screen" hidden>
  <header class="bar">
    <div class="bar-title">
      <span class="logo-sm">Spark</span>
      <span class="bar-sub">みらいっこ 季刊誌</span>
    </div>
    <button id="forget" class="ghost" type="button">とじる</button>
  </header>

  <main>
    <!-- 最新号 -->
    <section id="hero" class="hero" hidden>
      <button id="hero-btn" class="hero-cover" type="button" aria-label="最新号をひらく">
        <span class="cover"></span>
      </button>
      <div class="hero-text">
        <p class="eyebrow">最新号</p>
        <h2 id="hero-label"></h2>
        <p id="hero-pages" class="hero-pages"></p>
        <button id="hero-read" class="primary" type="button">読む</button>
      </div>
    </section>

    <!-- これまでの号 -->
    <h2 id="past-head" class="section-head" hidden>これまでの号</h2>
    <div id="shelf-groups"></div>
  </main>

  <footer class="foot">© 株式会社ストーリーボード</footer>
</section>

<!-- ③ 読む画面 -->
<section id="reader" class="screen" hidden>
  <header class="bar bar-dark">
    <button id="back" class="ghost" type="button">← 一覧</button>
    <div id="reader-title" class="bar-title"></div>
    <button id="sound" class="ghost icon" type="button" title="めくる音">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path class="spk" d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor"></path>
        <path class="on" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.6a7.5 7.5 0 0 1 0 10.8"
              fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
        <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"
              fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
      </svg>
    </button>
    <button id="zoom" class="ghost icon" type="button" title="大きく表示">⛶</button>
  </header>

  <div id="stage" class="stage">
    <div id="loading" class="loading" hidden>
      <div class="spinner"></div>
      <p id="loading-msg">よみこみ中…</p>
      <div class="progress"><div id="progress-bar"></div></div>
    </div>
    <div id="book" class="book"></div>
  </div>

  <nav class="pager">
    <button id="prev" type="button" aria-label="前のページ">‹</button>
    <span id="pageno">- / -</span>
    <button id="next" type="button" aria-label="次のページ">›</button>
  </nav>
</section>

<script src="vendor/page-flip.browser.js"></script>
<script src="app.js?v=7529ded2"></script>
</body>
</html>
